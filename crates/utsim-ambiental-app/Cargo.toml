[package]
name = "utsim-ambiental-app"
description = "UTSim Ambiental: energia, emissões e outros impactos da fábrica simulada, por máquina (janela nativa)"
# Own version and tag (`am-v<version>`), apart from the other apps.
version = "0.1.0"
edition.workspace = true
# eframe 0.36 needs Rust 1.95.
rust-version = "1.95"

[[bin]]
name = "utsim-ambiental"
path = "src/main.rs"

[lib]
name = "utsim_ambiental_app"
path = "src/lib.rs"

[dependencies]
utsim-ambiental-core.workspace = true
utsim-core.workspace = true
utsim-model.workspace = true
# The texts of the window in the five languages (`idiomas/<código>/ambiental.ftl`).
utsim-idiomas.workspace = true
# The settings file of the user (`utsim_pasta::config`): language and recent models.
utsim-pasta.workspace = true
# The family's opening screen, sidebar and the native file picker.
utsim-ui-tema = { workspace = true, features = ["familia", "arquivos", "abertura"] }
serde.workspace = true
# Same egui as the other apps, so Cargo.lock keeps one egui. Light: glow renderer only.
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[dev-dependencies]
utsim-ui-tema = { workspace = true, features = ["captura"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
